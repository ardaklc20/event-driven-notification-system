# One command starts the stack: docker compose up (D3).
# Start order (K6): postgres healthy -> migrate exits 0 -> api.
# Host ports are bound to 127.0.0.1 by default and can be changed with
# BIND_ADDRESS, API_PORT and POSTGRES_PORT (K39).

services:
  postgres:
    image: postgres:18.7-trixie
    environment:
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: notifications
      POSTGRES_DB: notifications
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # From version 18 the image declares its volume at /var/lib/postgresql (K38).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "notifications", "-d", "notifications"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s

  migrate:
    build: .
    command: ["/app/migrate", "up"]
    environment:
      DATABASE_URL: postgres://notifications:notifications@postgres:5432/notifications?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: ["/app/api"]
    environment:
      DATABASE_URL: postgres://notifications:notifications@postgres:5432/notifications?sslmode=disable
      HTTP_ADDR: ":8080"
      LOG_LEVEL: info
      SHUTDOWN_TIMEOUT: 10s
      SMS_CONTENT_LIMIT: "160"
      EMAIL_CONTENT_LIMIT: "10000"
      PUSH_CONTENT_LIMIT: "1000"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The image has no shell or curl; the binary checks /readyz itself (K31).
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    # Above the API's 10-second shutdown budget (K6).
    stop_grace_period: 15s

volumes:
  pgdata:
