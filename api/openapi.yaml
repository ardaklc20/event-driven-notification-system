components:
  schemas:
    AcceptedBody:
      additionalProperties: false
      properties:
        id:
          description: Notification ID (UUIDv7)
          format: uuid
          type: string
        status:
          description: "Always queued: the notification is saved and waits for a worker"
          enum:
            - queued
          type: string
      required:
        - id
        - status
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    LivenessBody:
      additionalProperties: false
      properties:
        status:
          description: Always ok while the process can answer
          enum:
            - ok
          type: string
      required:
        - status
      type: object
    NotificationBody:
      additionalProperties: false
      properties:
        attempts:
          description: Attempts started so far; an attempt counts when a worker claims the notification
          format: int64
          minimum: 0
          type: integer
        channel:
          enum:
            - sms
            - email
            - push
          type: string
        content:
          type: string
        created_at:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        last_error:
          description: The last delivery error, or null
          type:
            - string
            - "null"
        priority:
          enum:
            - high
            - normal
            - low
          type: string
        recipient:
          type: string
        status:
          enum:
            - queued
            - processing
            - sent
            - failed
            - cancelled
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - recipient
        - channel
        - content
        - priority
        - status
        - attempts
        - last_error
        - created_at
        - updated_at
      type: object
    NotificationRequest:
      additionalProperties: false
      properties:
        channel:
          enum:
            - sms
            - email
            - push
          examples:
            - sms
          type: string
        content:
          description: At most 160 (sms), 10000 (email) or 1000 (push) Unicode code points by default; the limits are configurable and apply to new notifications only.
          examples:
            - Your code is 123456
          minLength: 1
          type: string
        priority:
          default: normal
          enum:
            - high
            - normal
            - low
          type: string
        recipient:
          description: "sms: an E.164 number (+ and up to 15 digits). email: a plain address without a display name. push: a device token, no whitespace, at most 512 characters."
          examples:
            - "+905551234567"
          minLength: 1
          type: string
      required:
        - recipient
        - channel
        - content
      type: object
    ReadinessBody:
      additionalProperties: false
      properties:
        checks:
          additionalProperties:
            type: string
          description: "Result of each check by name, for example {\"database\": \"pass\"}"
          type: object
        status:
          description: ready when every check passed
          enum:
            - ready
          type: string
      required:
        - status
        - checks
      type: object
info:
  description: "Event-driven notification system: queue SMS, email and push notifications and track their delivery."
  title: Notification System API
  version: 1.0.0
openapi: 3.1.0
paths:
  /healthz:
    get:
      description: Answers 200 whenever the process can answer. It checks no dependency.
      operationId: get-healthz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Liveness
      tags:
        - Health
  /notifications:
    post:
      description: Validates the notification, saves it as queued and answers 202 at once, without waiting for delivery. With an Idempotency-Key, a repeat of the same request returns the first response byte for byte.
      operationId: create-notification
      parameters:
        - description: Optional. Sent once, 1 to 128 characters from A–Z, a–z, 0–9, '.', '_' and '-'. A repeat with the same key and the same request returns the first 202 response unchanged; the same key with a different request gets 422.
          in: header
          name: Idempotency-Key
          schema:
            description: Optional. Sent once, 1 to 128 characters from A–Z, a–z, 0–9, '.', '_' and '-'. A repeat with the same key and the same request returns the first 202 response unchanged; the same key with a different request gets 422.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedBody"
          description: Accepted and queued
          headers:
            Content-Type:
              schema:
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Create a notification
      tags:
        - Notifications
  /notifications/{id}:
    get:
      description: Returns the notification's current state. A malformed ID gets 422, an unknown one 404.
      operationId: get-notification
      parameters:
        - description: Notification ID
          in: path
          name: id
          required: true
          schema:
            description: Notification ID
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationBody"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Get a notification
      tags:
        - Notifications
  /readyz:
    get:
      description: Pings PostgreSQL with a short time limit. Answers 200 with each check's result, or 503 naming the failing check. Answers 503 once shutdown has started.
      operationId: get-readyz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessBody"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Readiness
      tags:
        - Health
