components:
  schemas:
    AcceptedBody:
      additionalProperties: false
      properties:
        id:
          description: Notification ID (UUIDv7)
          format: uuid
          type: string
        status:
          description: "Always queued: the notification is saved and waits for a worker"
          enum:
            - queued
          type: string
      required:
        - id
        - status
      type: object
    BatchAcceptedBody:
      additionalProperties: false
      properties:
        batch_id:
          description: Batch ID (UUIDv7)
          format: uuid
          type: string
        notification_ids:
          description: "The IDs in request order: notification_ids[i] belongs to notifications[i]"
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - batch_id
        - notification_ids
      type: object
    BatchBody:
      additionalProperties: false
      properties:
        counts:
          $ref: "#/components/schemas/BatchCounts"
          description: Read in the same snapshot as this page's items
        created_at:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        item_count:
          format: int64
          maximum: 1000
          minimum: 1
          type: integer
        items:
          description: "The batch's notifications, newest first: created_at descending, then ID descending"
          items:
            $ref: "#/components/schemas/NotificationBody"
          type:
            - array
            - "null"
        next_cursor:
          description: Pass as cursor to read the next page; absent on the last page
          type: string
      required:
        - id
        - item_count
        - created_at
        - counts
        - items
      type: object
    BatchCounts:
      additionalProperties: false
      properties:
        cancelled:
          format: int64
          minimum: 0
          type: integer
        failed:
          format: int64
          minimum: 0
          type: integer
        processing:
          format: int64
          minimum: 0
          type: integer
        queued:
          format: int64
          minimum: 0
          type: integer
        sent:
          format: int64
          minimum: 0
          type: integer
      required:
        - queued
        - processing
        - sent
        - failed
        - cancelled
      type: object
    BatchRequest:
      additionalProperties: false
      properties:
        notifications:
          description: 1 to 1000 notifications; each has its own channel and priority and follows the rules of POST /notifications
          items:
            $ref: "#/components/schemas/NotificationRequest"
          maxItems: 1000
          minItems: 1
          type:
            - array
            - "null"
      required:
        - notifications
      type: object
    CancelConflictBody:
      additionalProperties: false
      properties:
        current_status:
          description: The notification's status, read under its row lock
          enum:
            - processing
            - sent
            - failed
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      required:
        - current_status
      type: object
    ChannelMetricsBody:
      additionalProperties: false
      properties:
        completed:
          $ref: "#/components/schemas/CompletedBody"
        latency:
          $ref: "#/components/schemas/LatencyBody"
          description: created_at → sent_at of the window's sent notifications that were not scheduled, queue waiting and retries included
        processing:
          description: Notifications a worker holds at as_of; high while nothing completes means a stalled worker
          format: int64
          minimum: 0
          type: integer
        queue:
          $ref: "#/components/schemas/QueueBody"
        scheduled_latency:
          $ref: "#/components/schemas/LatencyBody"
          description: scheduled_at → sent_at of the window's sent notifications that were scheduled
      required:
        - queue
        - processing
        - completed
        - latency
        - scheduled_latency
      type: object
    ChannelsMetricsBody:
      additionalProperties: false
      properties:
        email:
          $ref: "#/components/schemas/ChannelMetricsBody"
        push:
          $ref: "#/components/schemas/ChannelMetricsBody"
        sms:
          $ref: "#/components/schemas/ChannelMetricsBody"
      required:
        - sms
        - email
        - push
      type: object
    CompletedBody:
      additionalProperties: false
      properties:
        failed:
          format: int64
          minimum: 0
          type: integer
        failed_per_second:
          description: failed / 60
          format: double
          minimum: 0
          type: number
        sent:
          format: int64
          minimum: 0
          type: integer
        sent_per_second:
          description: sent / 60
          format: double
          minimum: 0
          type: number
        success_ratio:
          description: sent / (sent + failed); null when nothing completed. Cancellations are not completions
          format: double
          maximum: 1
          minimum: 0
          type:
            - number
            - "null"
        window_seconds:
          description: "Always 60: completed_at after as_of − 60 s and at or before as_of"
          format: int64
          type: integer
      required:
        - window_seconds
        - sent
        - failed
        - sent_per_second
        - failed_per_second
        - success_ratio
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    LatencyBody:
      additionalProperties: false
      properties:
        p50_ms:
          description: null when samples is 0
          format: double
          type:
            - number
            - "null"
        p95_ms:
          description: null when samples is 0
          format: double
          type:
            - number
            - "null"
        p99_ms:
          description: null when samples is 0
          format: double
          type:
            - number
            - "null"
        samples:
          description: Notifications of this group sent in the window
          format: int64
          minimum: 0
          type: integer
      required:
        - samples
        - p50_ms
        - p95_ms
        - p99_ms
      type: object
    ListBody:
      additionalProperties: false
      properties:
        items:
          description: "Newest first: created_at descending, then ID descending"
          items:
            $ref: "#/components/schemas/NotificationBody"
          type:
            - array
            - "null"
        next_cursor:
          description: Pass as cursor to read the next page; absent on the last page
          type: string
      required:
        - items
      type: object
    LivenessBody:
      additionalProperties: false
      properties:
        status:
          description: Always ok while the process can answer
          enum:
            - ok
          type: string
      required:
        - status
      type: object
    MetricsBody:
      additionalProperties: false
      properties:
        as_of:
          description: The database time every value refers to; RFC 3339 with microseconds
          format: date-time
          type: string
        channels:
          $ref: "#/components/schemas/ChannelsMetricsBody"
      required:
        - as_of
        - channels
      type: object
    NotificationBody:
      additionalProperties: false
      properties:
        attempts:
          description: Attempts started so far; an attempt counts when a worker claims the notification
          format: int64
          minimum: 0
          type: integer
        batch_id:
          description: The batch the notification was created in, or null for a single create
          format: uuid
          type:
            - string
            - "null"
        channel:
          enum:
            - sms
            - email
            - push
          type: string
        content:
          type: string
        created_at:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        last_error:
          description: The last delivery error, or null
          type:
            - string
            - "null"
        priority:
          enum:
            - high
            - normal
            - low
          type: string
        provider_message_id:
          description: "The provider's messageId from its 202 response; null before sent, or when the response body was not usable. Not unique: a provider with a static response gives every notification the same ID."
          type:
            - string
            - "null"
        provider_timestamp:
          description: The time the provider reported in its 202 response, or null
          format: date-time
          type:
            - string
            - "null"
        recipient:
          type: string
        scheduled_at:
          description: The earliest send time the request asked for, in UTC, or null when the notification was not scheduled. Retries never change it
          format: date-time
          type:
            - string
            - "null"
        sent_at:
          description: When the provider's acceptance was recorded; set together with status sent
          format: date-time
          type:
            - string
            - "null"
        status:
          enum:
            - queued
            - processing
            - sent
            - failed
            - cancelled
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - recipient
        - channel
        - content
        - priority
        - status
        - attempts
        - last_error
        - batch_id
        - provider_message_id
        - provider_timestamp
        - sent_at
        - created_at
        - updated_at
        - scheduled_at
      type: object
    NotificationRequest:
      additionalProperties: false
      properties:
        channel:
          enum:
            - sms
            - email
            - push
          examples:
            - sms
          type: string
        content:
          description: At most 160 (sms), 10000 (email) or 1000 (push) Unicode code points by default; the limits are configurable and apply to new notifications only.
          examples:
            - Your code is 123456
          minLength: 1
          type: string
        priority:
          default: normal
          enum:
            - high
            - normal
            - low
          type: string
        recipient:
          description: "sms: an E.164 number (+ and up to 15 digits). email: a plain address without a display name. push: a device token, no whitespace, at most 512 characters."
          examples:
            - "+905551234567"
          minLength: 1
          type: string
        scheduled_at:
          description: Optional. The earliest time the notification may be sent, RFC 3339 with an offset (Z or ±hh:mm); a time without an offset gets 422. A new request whose time is at or before the server's clock gets 422; there is no upper limit. Without it the notification is sent as soon as possible.
          examples:
            - "2026-11-22T09:00:00Z"
          format: date-time
          type: string
      required:
        - recipient
        - channel
        - content
      type: object
    PriorityQueueBody:
      additionalProperties: false
      properties:
        deferred:
          description: queued with a later available_at, such as a retry waiting for its time
          format: int64
          minimum: 0
          type: integer
        oldest_ready_age_seconds:
          description: as_of minus the earliest available_at of the ready notifications; null when none is ready
          format: double
          type:
            - number
            - "null"
        ready:
          description: queued with available_at at or before as_of
          format: int64
          minimum: 0
          type: integer
      required:
        - ready
        - deferred
        - oldest_ready_age_seconds
      type: object
    QueueBody:
      additionalProperties: false
      properties:
        high:
          $ref: "#/components/schemas/PriorityQueueBody"
        low:
          $ref: "#/components/schemas/PriorityQueueBody"
        normal:
          $ref: "#/components/schemas/PriorityQueueBody"
      required:
        - high
        - normal
        - low
      type: object
    ReadinessBody:
      additionalProperties: false
      properties:
        checks:
          additionalProperties:
            type: string
          description: "Result of each check by name, for example {\"database\": \"pass\"}"
          type: object
        status:
          description: ready when every check passed
          enum:
            - ready
          type: string
      required:
        - status
        - checks
      type: object
info:
  description: "Event-driven notification system: queue SMS, email and push notifications and track their delivery."
  title: Notification System API
  version: 1.0.0
openapi: 3.1.0
paths:
  /batches/{id}:
    get:
      description: Returns the batch's notifications counted by status, every status included, and one page of its notifications in the listing order; follow next_cursor for the rest. The counts and the page are read in one snapshot. An unknown ID gets 404, a malformed one 422, a cursor no page produced 400.
      operationId: get-batch
      parameters:
        - description: Batch ID
          in: path
          name: id
          required: true
          schema:
            description: Batch ID
            format: uuid
            type: string
        - description: Page size; outside 1 to 200 gets 422
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: Page size; outside 1 to 200 gets 422
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - description: The next_cursor of the previous page, unchanged
          explode: false
          in: query
          name: cursor
          schema:
            description: The next_cursor of the previous page, unchanged
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchBody"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Get a batch's status
      tags:
        - Batches
  /healthz:
    get:
      description: Answers 200 whenever the process can answer. It checks no dependency.
      operationId: get-healthz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Liveness
      tags:
        - Health
  /metrics:
    get:
      description: "Reads every value in one database snapshot taken at as_of: per channel and priority the queued notifications that are ready and deferred and the age of the oldest ready one; the processing count; the notifications sent and failed in the last 60 seconds with their rates and success ratio; and the p50, p95 and p99 of created_at → sent_at for those sent without scheduled_at and of scheduled_at → sent_at for the scheduled ones. It summarizes completed notifications; the rate limit is proven by counting send starts, not by these numbers."
      operationId: get-metrics
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Queue depth, completions and latency per channel
      tags:
        - Metrics
  /notifications:
    get:
      description: Lists notifications newest first. status, channel, from and to filter with AND; the created_at range is half-open, from included and to excluded. Follow next_cursor to read further pages; notifications created meanwhile do not shift them. Each page is a separate query, so a notification whose status changes between pages can move into or out of a filtered list. A cursor that was not produced by a previous page gets 400.
      operationId: list-notifications
      parameters:
        - description: Only notifications with this status
          explode: false
          in: query
          name: status
          schema:
            description: Only notifications with this status
            enum:
              - queued
              - processing
              - sent
              - failed
              - cancelled
            type: string
        - description: Only notifications on this channel
          explode: false
          in: query
          name: channel
          schema:
            description: Only notifications on this channel
            enum:
              - sms
              - email
              - push
            type: string
        - description: Only notifications created at or after this time (RFC 3339, included)
          explode: false
          in: query
          name: from
          schema:
            description: Only notifications created at or after this time (RFC 3339, included)
            format: date-time
            type: string
        - description: Only notifications created before this time (RFC 3339, excluded)
          explode: false
          in: query
          name: to
          schema:
            description: Only notifications created before this time (RFC 3339, excluded)
            format: date-time
            type: string
        - description: Page size; outside 1 to 200 gets 422
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: Page size; outside 1 to 200 gets 422
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - description: The next_cursor of the previous page, unchanged
          explode: false
          in: query
          name: cursor
          schema:
            description: The next_cursor of the previous page, unchanged
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBody"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: List notifications
      tags:
        - Notifications
    post:
      description: Validates the notification, saves it as queued and answers 202 at once, without waiting for delivery. With an Idempotency-Key, a repeat of the same request returns the first response byte for byte.
      operationId: create-notification
      parameters:
        - description: Optional. Sent once, 1 to 128 characters from A–Z, a–z, 0–9, '.', '_' and '-'. A repeat with the same key and the same request returns the first 202 response unchanged; the same key with a different request gets 422.
          in: header
          name: Idempotency-Key
          schema:
            description: Optional. Sent once, 1 to 128 characters from A–Z, a–z, 0–9, '.', '_' and '-'. A repeat with the same key and the same request returns the first 202 response unchanged; the same key with a different request gets 422.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedBody"
          description: Accepted and queued
          headers:
            Content-Type:
              schema:
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Create a notification
      tags:
        - Notifications
  /notifications/batch:
    post:
      description: "Saves 1 to 1000 notifications all or nothing: if any item is invalid, the answer is 422 with each error's item index and field, and nothing is saved. Channels and priorities may be mixed. The body may be at most 16 MiB by default (BATCH_MAX_BODY_BYTES), so a batch of large items can get 413 with fewer than 1000 items."
      operationId: create-batch
      parameters:
        - description: Optional. One key covers the whole batch. Sent once, 1 to 128 characters from A–Z, a–z, 0–9, '.', '_' and '-'. A repeat with the same key and the same batch returns the first 202 response unchanged; the same key with a different request, or a key used for a single create, gets 422.
          in: header
          name: Idempotency-Key
          schema:
            description: Optional. One key covers the whole batch. Sent once, 1 to 128 characters from A–Z, a–z, 0–9, '.', '_' and '-'. A repeat with the same key and the same batch returns the first 202 response unchanged; the same key with a different request, or a key used for a single create, gets 422.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchAcceptedBody"
          description: Accepted; every notification is queued
          headers:
            Content-Type:
              schema:
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Request Entity Too Large
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Create a batch of notifications
      tags:
        - Batches
  /notifications/{id}:
    get:
      description: Returns the notification's current state. A malformed ID gets 422, an unknown one 404.
      operationId: get-notification
      parameters:
        - description: Notification ID
          in: path
          name: id
          required: true
          schema:
            description: Notification ID
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationBody"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Get a notification
      tags:
        - Notifications
  /notifications/{id}/cancel:
    post:
      description: "Cancels the notification while it is queued: waiting for its first attempt, for its channel's rate limit or for its retry time. A notification that is already cancelled answers 200 again. One that a worker holds (processing) or that has ended (sent, failed) answers 409 with its current status: its POST may already be on its way. After a 200, no new POST goes out for it. An unknown ID gets 404, a malformed one 422."
      operationId: cancel-notification
      parameters:
        - description: Notification ID
          in: path
          name: id
          required: true
          schema:
            description: Notification ID
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationBody"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/CancelConflictBody"
          description: The notification is processing, sent or failed and can no longer be cancelled
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Cancel a queued notification
      tags:
        - Notifications
  /readyz:
    get:
      description: Pings PostgreSQL with a short time limit. Answers 200 with each check's result, or 503 naming the failing check. Answers 503 once shutdown has started.
      operationId: get-readyz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessBody"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
